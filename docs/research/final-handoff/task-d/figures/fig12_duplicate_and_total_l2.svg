  <text x="902.0" y="626.6" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="12" fill="#0F172A" text-anchor="start">2. Định luật Amdahl: Thời gian truy vấn OFF không chỉ có phép tính L2, mà còn gồm duyệt CSR, truy cập bộ nhớ</text>
  <text x="902.0" y="644.6" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="12" fill="#0F172A" text-anchor="start">ngẫu nhiên (cache/DRAM), quản lý std::set, spin-wait barrier và pha merge đơn luồng.</text>
  <text x="902.0" y="672.6" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="12" fill="#0F172A" text-anchor="start">3. Truy cập lại một đỉnh có thể tận dụng cache. Tỷ lệ cache hit và chi phí riêng mỗi phép tính L2 chưa được đo.</text>
  <text x="902.0" y="700.6" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="12" fill="#0F172A" text-anchor="start">4. B1 ghi các ID để công bố tại barrier. A1 đưa dispatch vào merge. Thời gian merge ON 348.5 → 384.4 µs/q có</text>
  <text x="902.0" y="718.6" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="12" fill="#0F172A" text-anchor="start">ranh giới đo khác nhau giữa hai policy.</text>
