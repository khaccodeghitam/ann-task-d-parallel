  <text x="902.0" y="580.6" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="12" fill="#0F172A" text-anchor="start">1. Duplicate L2 chỉ chiếm 16.30% tổng L2 ban đầu (3,712.8 / 22,777.0) ⇒ giảm 74.98% phần trùng chỉ tương ứng</text>
