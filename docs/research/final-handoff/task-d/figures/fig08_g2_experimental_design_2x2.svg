  <text x="56.0" y="692.6" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="12" fill="#0F172A" text-anchor="start">• Cân bằng 12 block × 6 graph × 2 policy = 144 tiến trình OFF (72 cặp liền kề: 36 AB + 36 BA).</text>
  <text x="56.0" y="722.6" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="12" fill="#0F172A" text-anchor="start">• Mỗi đồ thị xuất hiện đúng 2 lần tại mỗi vị trí block 0..5 để cân bằng thứ tự chạy theo thời gian.</text>
  <text x="56.0" y="752.6" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="12" fill="#0F172A" text-anchor="start">• Giới hạn nhiễu CPU theo topology CCX: Workers [0..3] ≤ 0.010 | CCX0 [0..5] ≤ 0.020 | Host [0..11] ≤ 0.025.</text>
  <text x="56.0" y="782.6" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="12" fill="#0F172A" text-anchor="start">• Thực tế run2: max Workers = 0.0055, CCX0 = 0.0075, Host = 0.0070; Tctl max = 78.5°C (&lt; 95°C); AC = 1.</text>
  <text x="56.0" y="812.6" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="12" fill="#0F172A" text-anchor="start">• Môi trường sạch: systemd multi-user.target + prepare_quiet_tty_env.sh; khôi phục đầy đủ sau chạy.</text>
  <text x="56.0" y="842.6" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="12" fill="#0F172A" text-anchor="start">• Cô lập tuyệt đối 2 lượt HOLD lịch sử (design-3 #1 KeyError; run1 #120 firmware-notifier): 0/144 receipt trùng.</text>
