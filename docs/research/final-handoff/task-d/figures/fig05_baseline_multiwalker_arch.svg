  <text x="92.0" y="710.3" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="14" fill="#D97706" text-anchor="start" font-weight="bold">3. HÀNG RÀO SPIN-WAIT &amp; PHA HỢP NHẤT ĐƠN LUỒNG (Single-Writer Merge trên Worker 0 — Không cần Mutex)</text>
  <text x="92.0" y="739.4" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="13" fill="#0F172A" text-anchor="start">• Worker 0 spin-wait (cpu_relax ≤2048 lần, rồi yield) chờ Worker 1 đặt done_seq == next_seq. • Cập nhật mảng toàn cục: đánh dấu global_expanded_epoch_[u] = q_epoch; ở baseline đánh dấu settled_epoch_[v] cho</text>
  <text x="92.0" y="763.4" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="13" fill="#0F172A" text-anchor="start">local_expanded và local_discovered (NÚT CỔ CHAI B1: đỉnh bị loại bởi global_worst sẽ bị tính lại L2 ở các vòng sau!). • Sắp xếp &amp; loại trùng merge_scratch_, trộn tuyến tính O(B + M_r) với global_best_vec_ giữ top-B. • Dựng lại</text>
  <text x="92.0" y="787.4" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="13" fill="#0F172A" text-anchor="start">toàn bộ active_frontier_ (NÚT CỔ CHAI A1: duyệt hết B phần tử &amp; nạp lại tới 216 seed/worker vào std::set).</text>
