  <text x="892.0" y="443.3" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="start" font-weight="bold">2. WORKER 1 · alignas(64) WorkerState · Ghim CPU 2 (CCX 0)</text>
  <text x="890.0" y="482.6" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="12" fill="#0F172A" text-anchor="start" font-weight="bold">• Nạp init_seeds vào std::set&lt;Hit&gt; local_pending (Baseline: tối đa B/2 = 216 đỉnh)</text>
  <text x="890.0" y="505.6" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="12" fill="#0F172A" text-anchor="start" font-weight="bold">• Lặp tối đa S = 16 bước (steps &lt; sync_interval_ &amp;&amp; !local_pending.empty()):</text>
  <text x="890.0" y="528.6" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="12" fill="#475569" text-anchor="start">   1) Pop đỉnh tốt nhất u → ghi vào local_expanded</text>
  <text x="890.0" y="551.6" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="12" fill="#475569" text-anchor="start">   2) Duyệt láng giềng v: bỏ qua nếu settled_epoch_[v]==q_epoch || local_seen.contains_or_insert(v)</text>
  <text x="890.0" y="574.6" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="12" fill="#475569" text-anchor="start">   3) Tính squared_l2(v, q) bằng double (float64); loại sớm nếu hit &gt;= global_worst</text>
  <text x="890.0" y="597.6" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="12" fill="#475569" text-anchor="start">   4) Nếu lọt local_top (cỡ B): chèn local_top, local_pending và local_discovered</text>
  <text x="890.0" y="620.6" font-family="DejaVu Sans, Noto Sans, sans-serif" font-size="12" fill="#475569" text-anchor="start">• Ghi done_seq.store(next_seq, release) (Worker 1) / tiếp tục barrier (Worker 0)</text>
