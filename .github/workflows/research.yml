name: Research synthetic checks
on: [push, pull_request]
jobs:
  cpu-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-lite.txt
      - run: python -m unittest discover -s tests/research -v
      - run: python scripts/ann.py --help
      - run: python scripts/check_research_docs.py
      - run: git diff --check
