name: Research synthetic checks
on: [push, pull_request]
jobs:
  cpu-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-lite.txt
      - run: python -m unittest discover -s tests/research -v
      - name: Task D x A native graph contract (synthetic data only)
        run: |
          cmake -S research/task_da -B build-task-da -DCMAKE_BUILD_TYPE=Release
          cmake --build build-task-da -j2
          ctest --test-dir build-task-da --output-on-failure
      - name: Task D x A memory and undefined-behavior checks
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake -S research/task_da -B build-task-da-asan -DCMAKE_BUILD_TYPE=Debug -DSANITIZER=address,undefined
          cmake --build build-task-da-asan -j2
          ctest --test-dir build-task-da-asan --output-on-failure
      - run: python scripts/ann.py --help
      - run: python scripts/check_research_docs.py
      - run: git diff --check
